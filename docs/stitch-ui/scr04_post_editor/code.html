<!-- Minimalist Post Editor Card -->
<div class="flex flex-col w-full bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
<!-- Author Identity Row -->
<div class="flex items-center justify-between p-space-md bg-surface-container-lowest">
<div class="flex items-center gap-space-sm min-w-0">
<!-- Text-Only Initials Avatar (Design System Spec: 36px, Soft Blue background, Primary Bold/Semibold text) -->
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="font-label-md text-label-md font-semibold text-primary-container">AN</span>
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-1.5">
<span class="font-label-lg text-label-lg text-on-surface truncate">An Nguyen</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-surface-container text-primary font-caption-sm text-caption-sm font-medium">
              Public
            </span>
</div>
<span class="font-caption-sm text-caption-sm text-secondary truncate">Posting to your profile stream</span>
</div>
</div>
<!-- Tactile Visibility Pill Selector -->
<button aria-label="Change visibility" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-low text-secondary active:bg-surface-container transition-colors" id="audience-selector" type="button">
<span class="material-symbols-outlined text-[15px]">public</span>
<span class="font-caption-sm text-caption-sm font-medium">Anyone</span>
<span class="material-symbols-outlined text-[14px]">expand_more</span>
</button>
</div>
<!-- Main Pure Text Editor -->
<div class="flex flex-col p-space-md pt-1 bg-surface-container-lowest">
<label class="sr-only" for="post-composer-input">Post Content</label>
<textarea autofocus="" class="w-full resize-none bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-outline outline-none leading-relaxed selection:bg-primary-fixed" id="post-composer-input" maxlength="600" placeholder="What's on your mind?" rows="10">Having a peaceful Sunday morning with a warm cup of coffee and some great reading. Hope everyone is having a relaxing weekend!</textarea>
<!-- Editor Micro Utilities: Helper Hint & Dynamic Character Counter -->
<div class="flex items-center justify-between pt-space-sm bg-surface-container-lowest select-none">

<div class="flex items-center gap-2">
<span class="font-caption-sm text-caption-sm text-secondary tabular-nums" id="char-counter">116 / 600</span>
<!-- Soft Circular Typing Spark Indicator -->
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors duration-200" id="typing-indicator"></div>
</div>
</div>
</div>
</div>
<!-- Warm Minimalist Encouragement Banner -->

<!-- Bottom Fixed-Feel Publishing Anchor -->
<div class="mt-space-lg w-full flex flex-col gap-space-sm">
<button class="w-full h-11 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 transition-all duration-200 shadow-sm active:scale-[0.99]" id="publish-btn">
<span class="material-symbols-outlined text-[20px]">send</span>
<span class="">Publish Post</span>
</button>

</div>
</div>
<script>
  (function () {
    const textarea = document.getElementById('post-composer-input');
    const counter = document.getElementById('char-counter');
    const publishBtn = document.getElementById('publish-btn');
    const typingIndicator = document.getElementById('typing-indicator');

    if (!textarea || !counter || !publishBtn) return;

    // Auto-focus and place cursor at end
    textarea.focus();

    textarea.addEventListener('input', () => {
      const length = textarea.value.trim().length;
      const totalChars = textarea.value.length;
      counter.textContent = `${totalChars} / 600`;

      if (length > 0) {
        publishBtn.removeAttribute('disabled');
        publishBtn.className = 'w-full h-11 rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 transition-all duration-200 shadow-sm hover:brightness-105 active:brightness-95 active:scale-[0.99] cursor-pointer';
        typingIndicator.className = 'w-2 h-2 rounded-full bg-primary-container transition-colors duration-200 animate-pulse';
      } else {
        publishBtn.setAttribute('disabled', 'true');
        publishBtn.className = 'w-full h-11 rounded-lg bg-surface-variant text-outline font-label-lg text-label-lg flex items-center justify-center gap-2 transition-all duration-200 cursor-not-allowed active:scale-[0.99]';
        typingIndicator.className = 'w-2 h-2 rounded-full bg-surface-variant transition-colors duration-200';
      }
    });
  })();
</script></main>
