<span class="material-symbols-outlined text-[20px]">mode_comment</span>

</button>
<!-- Save Button -->

<span class="material-symbols-outlined text-[20px]" id="save-icon">bookmark</span>
<span class="font-label-md text-label-md font-medium" id="save-label">Save</span>
</button>

</article>
<!-- Discussion Preview Section -->

<!-- Likes Bottom Sheet Modal -->
<div class="hidden fixed inset-0 bg-inverse-surface/40 z-50 flex items-end justify-center transition-opacity" id="likes-sheet-backdrop">
<div class="w-full max-w-lg bg-surface-container-lowest rounded-t-2xl shadow-xl flex flex-col max-h-[70vh] transform transition-transform duration-200 translate-y-full" id="likes-sheet-panel">
<!-- Drag handle & Header -->
<div class="pt-3 pb-2 px-space-md flex flex-col items-center">
<div class="w-10 h-1 bg-surface-container-highest rounded-full mb-3"></div>
<div class="w-full flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="font-title-sm text-title-sm text-on-surface">Liked by</span>
<span class="px-2 py-0.5 rounded-full bg-surface-container text-primary font-caption-sm text-caption-sm font-semibold">12</span>
</div>
<button aria-label="Close likes sheet" class="w-8 h-8 rounded-full flex items-center justify-center text-secondary hover:bg-surface-container-low transition-colors" id="close-likes-btn" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Divider -->
<div class="h-px bg-surface-container-high w-full"></div>
<!-- Likes List -->
<div class="overflow-y-auto px-space-md py-space-sm space-y-3">
<div class="flex items-center justify-between py-1">
<div class="flex items-center gap-space-sm">
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center font-label-md text-label-md text-primary font-semibold">BT</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface font-semibold">Binh Tran</span>
<span class="font-caption-sm text-caption-sm text-secondary">@binhtran</span>
</div>
</div>
<button class="h-8 px-3 rounded-full bg-surface-container text-primary font-label-sm text-label-sm font-semibold" type="button">Follow</button>
</div>
<div class="flex items-center justify-between py-1">
<div class="flex items-center gap-space-sm">
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center font-label-md text-label-md text-primary font-semibold">ML</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface font-semibold">Minh Le</span>
<span class="font-caption-sm text-caption-sm text-secondary">@minhle</span>
</div>
</div>
<button class="h-8 px-3 rounded-full bg-surface-container text-primary font-label-sm text-label-sm font-semibold" type="button">Follow</button>

<div class="flex items-center gap-space-sm">
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center font-label-md text-label-md text-primary font-semibold">KP</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface font-semibold">Kim Pham</span>
<span class="font-caption-sm text-caption-sm text-secondary">@kimpham</span>
</div>
</div>
<span class="font-caption-sm text-caption-sm text-secondary px-2">Following</span>
</div>
<div class="flex items-center justify-between py-1">
<div class="flex items-center gap-space-sm">
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center font-label-md text-label-md text-primary font-semibold">DH</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface font-semibold">Duy Hoang</span>
<span class="font-caption-sm text-caption-sm text-secondary">@duyhoang</span>
</div>
</div>
<button class="h-8 px-3 rounded-full bg-surface-container text-primary font-label-sm text-label-sm font-semibold" type="button">Follow</button>
</div>
</div>
</div>
</div>
</div>
<script>
  (function () {
    // Like toggling state
    const likeBtn = document.getElementById('like-action-btn');
    const likeIcon = document.getElementById('like-icon');
    const likeLabel = document.getElementById('like-label');
    let isLiked = true;

    if (likeBtn && likeIcon && likeLabel) {
      likeBtn.addEventListener('click', function () {
        isLiked = !isLiked;
        if (isLiked) {
          likeIcon.style.fontVariationSettings = "'FILL' 1";
          likeBtn.className = 'flex items-center justify-center gap-1.5 h-10 rounded-lg bg-surface-container-low hover:bg-surface-container transition-all active:scale-95 text-primary';
          likeLabel.textContent = 'Liked';
        } else {
          likeIcon.style.fontVariationSettings = "'FILL' 0";
          likeBtn.className = 'flex items-center justify-center gap-1.5 h-10 rounded-lg hover:bg-surface-container-low active:bg-surface-container transition-all text-secondary';
          likeLabel.textContent = 'Like';
        }
      });
    }

    // Save toggling state
    const saveBtn = document.getElementById('save-action-btn');
    const saveIcon = document.getElementById('save-icon');
    const saveLabel = document.getElementById('save-label');
    let isSaved = false;

    if (saveBtn && saveIcon && saveLabel) {
      saveBtn.addEventListener('click', function () {
        isSaved = !isSaved;
        if (isSaved) {
          saveIcon.style.fontVariationSettings = "'FILL' 1";
          saveBtn.classList.add('text-primary');
          saveBtn.classList.remove('text-secondary');
          saveLabel.textContent = 'Saved';
        } else {
          saveIcon.style.fontVariationSettings = "'FILL' 0";
          saveBtn.classList.remove('text-primary');
          saveBtn.classList.add('text-secondary');
          saveLabel.textContent = 'Save';
        }
      });
    }

    // Post Options Dropdown
    const postOptionsBtn = document.getElementById('post-options-btn');
    const postOptionsMenu = document.getElementById('post-options-menu');

    if (postOptionsBtn && postOptionsMenu) {
      postOptionsBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        postOptionsMenu.classList.toggle('hidden');
      });

      document.addEventListener('click', function (e) {
        if (!postOptionsMenu.contains(e.target) && e.target !== postOptionsBtn) {
          postOptionsMenu.classList.add('hidden');
        }
      });
    }

    // Focus composer on comment tap
    const focusComposerBtn = document.getElementById('focus-composer-btn');
    const quickCommentInput = document.getElementById('quick-comment-input');

    if (focusComposerBtn && quickCommentInput) {
      focusComposerBtn.addEventListener('click', function () {
        quickCommentInput.focus();
      });
    }

    // Likes Bottom Sheet Modal
    const openLikesBtn = document.getElementById('open-likes-btn');
    const closeLikesBtn = document.getElementById('close-likes-btn');
    const likesSheetBackdrop = document.getElementById('likes-sheet-backdrop');
    const likesSheetPanel = document.getElementById('likes-sheet-panel');

    function openLikesSheet() {
      if (!likesSheetBackdrop || !likesSheetPanel) return;
      likesSheetBackdrop.classList.remove('hidden');
      setTimeout(function () {
        likesSheetPanel.classList.remove('translate-y-full');
      }, 10);
    }

    function closeLikesSheet() {
      if (!likesSheetBackdrop || !likesSheetPanel) return;
      likesSheetPanel.classList.add('translate-y-full');
      setTimeout(function () {
        likesSheetBackdrop.classList.add('hidden');
      }, 200);
    }

    if (openLikesBtn) {
      openLikesBtn.addEventListener('click', openLikesSheet);
    }

    if (closeLikesBtn) {
      closeLikesBtn.addEventListener('click', closeLikesSheet);
    }

    if (likesSheetBackdrop) {
      likesSheetBackdrop.addEventListener('click', function (e) {
        if (e.target === likesSheetBackdrop) {
          closeLikesSheet();
        }
      });
    }
  })();
</script></main>
