<div class="relative w-16 h-16 rounded-2xl overflow-hidden shadow-md flex items-center justify-center bg-primary-container mb-space-md"><span class="font-headline-lg text-headline-lg font-semibold text-on-primary select-none leading-none flex items-center justify-center">M</span></div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs">
        Mini Social
      </h1>
<p class="font-body-md text-body-md text-secondary">

      </p>
</div>
<!-- Login Form Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-lg flex flex-col gap-space-lg">
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">

<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="phone-input">
            Phone Number

<div class="relative flex items-center">
<span class="material-symbols-outlined text-[20px] text-secondary absolute left-3 select-none pointer-events-none">
              call
            </span>
<input class="w-full h-11 pl-10 pr-3 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-secondary focus:outline-none focus:bg-surface-container-low transition-colors duration-150" id="phone-input" inputmode="tel" placeholder="+84 912 345 678" type="tel">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="password-input">
            Password
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined text-[20px] text-secondary absolute left-3 select-none pointer-events-none">

            </span>

<div class="pt-space-xs">

            Log In
          </button>
</div>
</form>
</div>

<div class="mt-space-lg text-center">
<p class="font-body-md text-body-md text-secondary">

        <a class="font-label-md text-label-md text-primary font-semibold hover:underline inline-block ml-1 transition-colors" href="#signup">

<script>
  (function() {
    const passwordInput = document.getElementById('password-input');
    const toggleButton = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }
  })();
