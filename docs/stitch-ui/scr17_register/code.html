<div class="flex flex-col items-center justify-between w-full max-w-sm mx-auto py-space-md min-h-[calc(100vh-4rem)]">

<div class="flex flex-col items-center text-center w-full mt-space-sm mb-space-lg">
<div class="relative mb-space-md transition-transform active:scale-95 duration-200">
<div class="w-14 h-14 rounded-2xl bg-primary-container shadow-sm flex items-center justify-center text-on-primary font-bold text-[28px] select-none">M</div>
<span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-tertiary-container rounded-full ring-2 ring-surface"></span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight mb-space-xs">
        Join Mini Social
      </h1>
<p class="font-body-md text-body-md text-secondary max-w-[260px]">

      </p>
</div>
<!-- Main Registration Form Container -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-auto">
<form class="flex flex-col space-y-space-md" onsubmit="event.preventDefault();">
<!-- Field 1: Full Name -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface font-medium" for="reg-fullname">
            Full Name

<div class="relative flex items-center">
<span class="absolute left-space-md text-secondary pointer-events-none material-symbols-outlined text-[20px]">

<input class="w-full h-11 pl-11 pr-space-md bg-surface-container-low text-on-surface placeholder:text-secondary rounded-lg font-body-md text-body-md outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#0866ff] transition-all" id="reg-fullname" placeholder="e.g. An Nguyen" type="text">
</div>
</div>
<!-- Field 2: Phone Number -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface font-medium" for="reg-phone">
            Phone Number
          </label>
<div class="relative flex items-center">
<span class="absolute left-space-md text-secondary pointer-events-none material-symbols-outlined text-[20px]">

            </span>

</div>

<div class="flex flex-col space-y-space-xs">

            Password

<span class="absolute left-space-md text-secondary pointer-events-none material-symbols-outlined text-[20px]">
              lock
            </span>

<button class="w-full py-3.5 bg-primary-container text-on-primary font-label-lg text-label-lg rounded-xl shadow-sm hover:brightness-105 active:scale-[0.99] active:brightness-95 transition-all flex items-center justify-center gap-space-xs cursor-pointer select-none" type="submit">

        </a>

</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdInput = document.getElementById('reg-password');
    const pwdIcon = document.getElementById('pwd-icon');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }
  })();
